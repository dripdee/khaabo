x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://khaabo:khaabo@db:5432/khaabo
  SYNC_DATABASE_URL: postgresql+psycopg://khaabo:khaabo@db:5432/khaabo
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENV: ${ENV:-development}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-dev@example.com}
  DEFAULT_CITY_SLUG: ${DEFAULT_CITY_SLUG:-kolkata}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
  AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-true}
  AI_PROVIDER: ${AI_PROVIDER:-heuristic}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  SOURCES_ENABLED: ${SOURCES_ENABLED:-osm,user}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: khaabo
      POSTGRES_PASSWORD: khaabo
      POSTGRES_DB: khaabo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khaabo -d khaabo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment: *api-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment: *api-env
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      -Q ingestion,ai_processing,ranking,summarization
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    environment: *api-env
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    profiles: ["ops"]
    environment: *api-env
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  db_data:
  redis_data:
  ollama_data:
