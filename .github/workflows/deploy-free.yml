name: Deploy (free-tier)

# Deploys the backend to the Oracle Cloud Always Free VM, pulling the image
# CI just pushed to GHCR.
#
# The frontend (SPA) is NOT deployed here. It is a Cloudflare *Pages* project
# connected to this repository: pushing to main triggers Cloudflare's build,
# which injects the VITE_* environment variables configured in the Pages
# dashboard. Wrangler / Workers static assets are no longer used. See
# DEPLOY-WORKFLOW.md.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST           Oracle VM public IP
#   DEPLOY_USER           'ubuntu' on Oracle
#   DEPLOY_SSH_KEY        private key for the deploy user (corresponding public
#                         key must be in /home/ubuntu/.ssh/authorized_keys)
#   GHCR_TOKEN            GitHub PAT with `read:packages` for the VM to pull images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-free-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/khaabo

jobs:
  build-and-push:
    name: Build & push backend image to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:production

  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy infra files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            docker-compose.yml,
            docker-compose.free.yml,
            deploy/caddy/Caddyfile.free,
            deploy/caddy/Dockerfile,
            scripts/backup-db.sh,
            scripts/restore-db.sh,
            scripts/generate_sitemap.py
          target: /opt/khaabo

      - name: Pull image & roll services
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG
          # The .env on the VM holds the production secrets. We never echo it
          # to avoid leaking values into Actions logs.
          script: |
            set -e
            cd /opt/khaabo
            # Compose-file order matters: the free overlay overrides the base.
            DC="docker compose -f docker-compose.yml -f docker-compose.free.yml"

            # GITHUB_* env vars only exist inside Actions — on the VM the compose
            # default for the image org would silently fall back to the wrong
            # name and `docker compose pull` would skip it. Pin the exact image
            # we just pushed and make sure every service runs it.
            export API_IMAGE="ghcr.io/${{ github.repository_owner }}/khaabo-backend:${DEPLOY_TAG}"
            echo "Deploying image: $API_IMAGE"

            # Login to GHCR so the VM can pull the image we just pushed.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # caddy is built locally (no registry image) — pull everything else.
            $DC pull api worker beat

            # Hard-fail if the pull did not land the image we pushed.
            docker image inspect "$API_IMAGE" >/dev/null || { echo "::error::image $API_IMAGE missing after pull"; exit 1; }

            # Run migrations as a one-shot before rolling the API.
            $DC run --rm --no-deps api alembic upgrade head

            # Roll services off the new image. --force-recreate + --pull protect
            # against config drift on the VM.
            $DC up -d --force-recreate worker beat
            sleep 5
            $DC up -d --force-recreate api
            $DC up -d caddy

            # Belt-and-braces: every service must run the exact pushed image.
            WANT=$(docker image inspect -f '{{.Id}}' "$API_IMAGE")
            for s in api worker beat; do
              GOT=$(docker inspect -f '{{.Image}}' "khaabo-$s-1")
              [ "$GOT" = "$WANT" ] || { echo "::error::$s runs $GOT, expected $WANT"; exit 1; }
            done

            docker image prune -f

            # Smoke test: the API must report 'status' (ok or degraded).
            # The image runs alembic + uvicorn on start; on a 1GB VM that can
            # take ~40s when the pool is cold, so poll instead of one-shot curl.
            OK=0
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:8000/api/v1/health 2>/dev/null | grep -q '"status"'; then
                OK=1; break
              fi
              echo "waiting for API health (attempt $i/12)..."
              sleep 5
            done
            [ "$OK" = "1" ] || { echo "::error::API never became healthy"; exit 1; }
            echo "✅ deployed backend"
