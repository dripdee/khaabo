name: Deploy (free-tier)

# Deploys the backend to the Oracle Cloud Always Free VM, pulling images from
# GHCR, and the SPA to Cloudflare Workers static assets via wrangler.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST           Oracle VM public IP (e.g. 168.138.x.x)
#   DEPLOY_USER           'ubuntu' on Oracle
#   DEPLOY_SSH_KEY        private key for the deploy user (corresponding public
#                         key must be in /home/ubuntu/.ssh/authorized_keys)
#   GHCR_TOKEN            GitHub PAT with `read:packages` for the VM to pull images
#   CLOUDFLARE_API_TOKEN  Wrangler deploy token (My Profile → API Tokens,
#                         with "Workers Scripts — Edit" permission)
#
# Required repo *variables* (Settings → Secrets → Variables):
#   CLOUDFLARE_ACCOUNT_ID Cloudflare account ID
#
# Frontend build inputs (set as repo secrets; baked into the bundle at build):
#   VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-free-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/khaabo

jobs:
  build-and-push:
    name: Build & push backend image to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:production

  deploy-frontend:
    name: Deploy SPA to Cloudflare (Workers static assets)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # wrangler.jsonc lives at the repo root; deploy from there so the
      # assets.directory (./frontend/dist) resolves.
      - name: Deploy static assets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy infra files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            docker-compose.yml,
            docker-compose.free.yml,
            deploy/caddy/Caddyfile.free,
            deploy/caddy/Dockerfile,
            scripts/backup-db.sh,
            scripts/restore-db.sh,
            scripts/generate_sitemap.py
          target: /opt/khaabo

      - name: Pull image & roll services
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG
          # The .env on the VM holds the production secrets. We never echo it
          # to avoid leaking values into Actions logs.
          script: |
            cd /opt/khaabo
            # Compose-file order matters: the free overlay overrides the base.
            DC="docker compose -f docker-compose.yml -f docker-compose.free.yml"

            # Login to GHCR so the VM can pull the image we just pushed.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            $DC pull api worker beat caddy

            # Run migrations as a one-shot before rolling the API.
            $DC run --rm --no-deps api alembic upgrade head

            # Roll worker/beat first (they tolerate a brief overlap with the old
            # API version because the schema only moves forward), then api/caddy.
            $DC up -d worker beat
            sleep 5
            $DC up -d api caddy

            docker image prune -f

            # Smoke test: the API must report 'status' (ok or degraded).
            sleep 10
            curl -fsS http://localhost:8000/api/v1/health | grep -q '"status"'
            echo "✅ deployed"
