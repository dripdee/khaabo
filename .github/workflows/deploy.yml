name: Deploy

# Legacy full-stack deployment. Khaabo's production deployment uses
# deploy-free.yml; retain this workflow only for an intentional manual run.
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/khaabo

jobs:
  # ─── Build & push images to GHCR (only on main / tags) ──────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    outputs:
      digest-backend: ${{ steps.push-backend.outputs.digest }}
      digest-frontend: ${{ steps.push-frontend.outputs.digest }}
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Backend image
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:production

      - name: Frontend image
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:production

  # ─── SSH into the server and roll the deploy ──────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            docker-compose.yml,
            docker-compose.prod.yml,
            deploy/caddy/Caddyfile,
            deploy/caddy/Dockerfile
          target: /opt/khaabo

      - name: Pull images & run migrations & restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG
          script: |
            cd /opt/khaabo
            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api worker beat web caddy
            # Run migrations as a one-shot before rolling the API
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
              --no-deps api alembic upgrade head
            # Roll services (worker/beat first so they pick up new code, then api)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d worker beat
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api web caddy
            # Prune old images to avoid filling disk
            docker image prune -f
            # Smoke: health check
            sleep 10
            curl -fsS http://localhost:8000/api/v1/health | grep -q '"status"'
